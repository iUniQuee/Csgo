name: Monthly HLTV roster sync

on:
  schedule:
    # 00:00 UTC on the first day of every month.
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-hltv-roster-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh and commit monthly roster
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh monthly HLTV roster
        run: node scripts/sync-hltv-roster.mjs

      - name: Commit updated roster
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/monthly-roster.json; then
            echo "Roster already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/monthly-roster.json
          git commit -m "chore: monthly HLTV roster sync ($(date -u +%Y-%m))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
